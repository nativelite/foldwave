[package]
name = "nativelite-fwterm"
version = "0.1.0"
description = "foldwave's minimal terminal prototype: one pane, a real shell through ConPTY, vterm, and the fwrender window - built to be measured against other terminals."
license = "MIT"
publish = false
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

# nativelite core rule: ZERO third-party dependencies; org crates only.
[dependencies]
pty = { package = "nativelite-pty", version = "0.4.1", path = "../../../pty-rs" }
vterm = { package = "nativelite-vterm", version = "0.5.3", path = "../../../vterm-rs" }
fwrender = { package = "nativelite-fwrender", version = "0.1.0", path = "../fwrender" }
fwbench = { package = "nativelite-fwbench", version = "0.1.0", path = "../fwbench" }

[[bin]]
name = "fwterm"
path = "src/main.rs"
