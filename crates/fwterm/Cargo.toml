[package]
name = "nativelite-fwterm"
version = "0.1.0"
description = "foldwave's minimal terminal prototype: split panes in one window, each a real shell through ConPTY or a program over pipes, vterm, and the fwrender window - built to be measured against other terminals."
# The foldwave app: FSL-1.1-Apache-2.0, the repository's LICENSE (design
# section 11 row 2). The engine crates it is built on stay MIT.
license-file = "../../LICENSE"
publish = false
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

# nativelite core rule: ZERO third-party dependencies; org crates only.
[dependencies]
pty = { package = "nativelite-pty", version = "0.4.1", path = "../../../pty-rs" }
ansi = { package = "nativelite-ansi", version = "0.4.0", path = "../../../ansi-rs" }
vterm = { package = "nativelite-vterm", version = "0.5.3", path = "../../../vterm-rs" }
panelog = { package = "nativelite-panelog", version = "0.1.0", path = "../../../panelog-rs" }
fwrender = { package = "nativelite-fwrender", version = "0.1.0", path = "../fwrender" }
fwcuda = { package = "nativelite-fwcuda", version = "0.1.0", path = "../fwcuda" }
resmon = { package = "nativelite-resmon", version = "0.1.0", path = "../resmon" }
fwbench = { package = "nativelite-fwbench", version = "0.1.0", path = "../fwbench" }

[[bin]]
name = "fwterm"
path = "src/main.rs"
