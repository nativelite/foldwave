[package]
name = "nativelite-fwbench"
version = "0.1.0"
description = "foldwave M0 harness: drive N pty panes of agent-like output and measure throughput, key-echo latency and resource attribution."
license = "MIT"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

# nativelite rule: zero THIRD-PARTY dependencies; org crates only.
[dependencies]
pty = { package = "nativelite-pty", version = "0.4.1", path = "../../../pty-rs" }
resmon = { package = "nativelite-resmon", version = "0.1.0", path = "../resmon" }
ansi = { package = "nativelite-ansi", version = "0.4.0", path = "../../../ansi-rs" }
fwcuda = { package = "nativelite-fwcuda", version = "0.1.0", path = "../fwcuda" }
vterm = { package = "nativelite-vterm", version = "0.5.3", path = "../../../vterm-rs" }

[lib]
name = "fwbench"
path = "src/lib.rs"

[[bin]]
name = "fwbench"
path = "src/main.rs"
