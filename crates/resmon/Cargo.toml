[package]
name = "nativelite-resmon"
version = "0.1.0"
description = "Attribute CPU, memory, disk I/O and GPU use to process trees over a sampling window, using only the Rust standard library."
license = "MIT"
keywords = ["resource", "cpu", "gpu", "profiling", "nativelite"]
categories = ["os", "development-tools::profiling"]
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

# nativelite core rule: ZERO third-party dependencies. Do not add to this.
# (Win32 is reached through our own extern blocks, no crates.)
[dependencies]

[lib]
name = "resmon"
path = "src/lib.rs"

[[bin]]
name = "resmon"
path = "src/bin/resmon.rs"
